# SQuizz — www.squizz.fun (proxied to the Next.js server on 127.0.0.1:3010)
# Installed by deploy/setup-server.sh; certbot adds the certificate lines on first run.

limit_req_zone $binary_remote_addr zone=squizz_auth:10m rate=10r/m;

# Security headers, repeated in every location that sets its own add_header (Nginx does not inherit them).
map $scheme $squizz_hsts { default "max-age=31536000; includeSubDomains; preload"; }

server {
    listen 80;
    listen [::]:80;
    server_name squizz.fun www.squizz.fun;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://www.squizz.fun$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name squizz.fun;
    ssl_certificate /etc/letsencrypt/live/squizz.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/squizz.fun/privkey.pem;
    return 301 https://www.squizz.fun$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.squizz.fun;
    ssl_certificate /etc/letsencrypt/live/squizz.fun/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/squizz.fun/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    server_tokens off;

    access_log /var/log/nginx/squizz.access.log;
    error_log /var/log/nginx/squizz.error.log warn;

    # Compress text assets (JS, CSS, JSON, SVG): about -70 % on the first visit.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml application/xml;

    # Media uploads go up to 20 MB.
    client_max_body_size 22m;

    add_header Strict-Transport-Security $squizz_hsts always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Shared by every location below.
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    # CVE-2025-29927: never let a client-supplied header skip Next.js middleware.
    proxy_set_header x-middleware-subrequest "";

    location /_next/static/ {
        alias /opt/squizz/app/.next/static/;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header Strict-Transport-Security $squizz_hsts always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /api/auth/callback/ {
        limit_req zone=squizz_auth burst=10 nodelay;
        proxy_pass http://127.0.0.1:3010;
    }

    # Quiz generation waits for the organisation's AI provider: up to 3 minutes for a long document.
    location /api/ai/ {
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
        proxy_pass http://127.0.0.1:3010;
    }

    location / {
        proxy_pass http://127.0.0.1:3010;
    }
}
