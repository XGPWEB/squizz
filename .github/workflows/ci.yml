# Checks every push and pull request: types, lint, formatting, unit tests, then the integration scenarios
# against a throwaway PostgreSQL (never development or production data).
name: CI

on:
  push:
    branches: [main, plateforme]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Types, lint, tests unitaires
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npx prettier --check app components lib tests prisma/seed.ts deploy/*.mjs
      - run: npm test

  integration:
    name: Scénarios d’intégration
    runs-on: ubuntu-latest
    needs: checks
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      E2E_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/squizz_e2e
      SEED_SUPER_ADMIN_EMAIL: superadmin@squizz.test
      SEED_SUPER_ADMIN_PASSWORD: Ci-super-admin-password-42
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      # The « browser » scenarios drive a real Chromium and a real WebKit (tests/browser).
      - run: npx playwright install --with-deps chromium webkit
      - run: bash scripts/e2e.sh
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: traces-navigateur
          path: .playwright
          # The folder's name starts with a dot: without this, nothing is uploaded.
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 7
